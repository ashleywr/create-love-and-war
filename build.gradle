plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'net.pttheta.loveandwar'
version = mod_version + '-' + minecraft_version
base.archivesName = 'createloveandwar'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = file('../private/run-client')
        }
        server {
            server()
            gameDirectory = file('../private/run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('../private/run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'createloveandwar'
        }
    }
    mods {
        createloveandwar { sourceSet(sourceSets.main) }
    }
}

dependencies {
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    implementation "net.createmod.ponder:ponder-neoforge:1.0.85+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:1.0.6"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:1.0.6"
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { line -> line.replace('version = "1.0.9-1.21.1"', 'version = "' + project.version + '"') }
    }
    exclude 'META-INF/MANIFEST.MF'
}
