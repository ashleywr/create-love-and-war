name: Build and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon build runGameTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-test-results
          path: |
            build/libs/
            build/reports/tests/
            ../private/run-gametest/logs/
            ../private/run-gametest/results.xml
